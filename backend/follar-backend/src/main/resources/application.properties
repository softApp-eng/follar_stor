server.port=8080

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:follardb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Secret & Expiration (24 hours)
follar.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
follar.jwt.expiration=86400000

# Uploaded article photos are stored inside the project
follar.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
