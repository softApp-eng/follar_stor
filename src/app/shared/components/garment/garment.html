<svg
  class="garment"
  [class.is-floating]="animated()"
  viewBox="0 0 300 420"
  role="img"
  [attr.aria-label]="'Illustration ' + product().name"
>
  <defs>
    <radialGradient [attr.id]="glowId" cx="50%" cy="50%" r="50%">
      <stop offset="0%" [attr.stop-color]="palette().aura" stop-opacity="0.55" />
      <stop offset="55%" [attr.stop-color]="palette().aura" stop-opacity="0.16" />
      <stop offset="100%" [attr.stop-color]="palette().aura" stop-opacity="0" />
    </radialGradient>

    <radialGradient [attr.id]="shadowId" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111110" stop-opacity="0.28" />
      <stop offset="70%" stop-color="#111110" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#111110" stop-opacity="0" />
    </radialGradient>

    <linearGradient [attr.id]="fabricId" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" [attr.stop-color]="palette().fabricA" />
      <stop offset="52%" [attr.stop-color]="palette().fabricA" />
      <stop offset="100%" [attr.stop-color]="palette().fabricB" />
    </linearGradient>

    <linearGradient [attr.id]="shineId" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <ellipse cx="150" cy="214" rx="122" ry="172" [attr.fill]="'url(#' + glowId + ')'" />
  <ellipse cx="150" cy="394" rx="76" ry="13" [attr.fill]="'url(#' + shadowId + ')'" />

  @switch (product().garment) {
    @case ('coat') {
      <g>
        <path
          d="M104 84 L82 104 L58 206 L80 216 L108 134 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M196 84 L218 104 L242 206 L220 216 L192 134 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M104 76 L150 92 L196 76 L214 96 L214 376 L86 376 L86 96 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path
          d="M150 92 L124 112 L150 160 L176 112 Z"
          [attr.fill]="palette().fabricB"
          fill-opacity="0.55"
        />
        <path d="M150 160 V376" [attr.stroke]="palette().accent" stroke-opacity="0.3" stroke-width="1.2" />
        <circle cx="150" cy="190" r="3" [attr.fill]="palette().accent" />
        <circle cx="150" cy="228" r="3" [attr.fill]="palette().accent" />
        <circle cx="150" cy="266" r="3" [attr.fill]="palette().accent" />
        <path d="M104 286 H136" [attr.stroke]="palette().accent" stroke-opacity="0.32" stroke-width="1.1" />
        <path d="M164 286 H196" [attr.stroke]="palette().accent" stroke-opacity="0.32" stroke-width="1.1" />
        <path
          d="M150 92 L150 376"
          stroke="#ffffff"
          stroke-opacity="0.16"
          stroke-width="14"
          stroke-linecap="round"
        />
      </g>
    }

    @case ('trench') {
      <g>
        <path
          d="M104 84 L80 104 L56 210 L78 220 L108 136 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M196 84 L220 104 L244 210 L222 220 L192 136 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M104 76 L150 92 L196 76 L214 96 L214 386 L86 386 L86 96 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path
          d="M150 92 L124 112 L150 158 L176 112 Z"
          [attr.fill]="palette().fabricB"
          fill-opacity="0.45"
        />
        <rect x="86" y="236" width="128" height="20" [attr.fill]="palette().accent" fill-opacity="0.3" />
        <rect
          x="139"
          y="230"
          width="22"
          height="32"
          [attr.fill]="palette().fabricB"
          stroke="rgba(17,17,16,0.25)"
          stroke-width="1"
        />
        <circle cx="132" cy="196" r="3" [attr.fill]="palette().accent" />
        <circle cx="132" cy="220" r="3" [attr.fill]="palette().accent" />
        <circle cx="168" cy="196" r="3" [attr.fill]="palette().accent" />
        <circle cx="168" cy="220" r="3" [attr.fill]="palette().accent" />
        <path d="M104 300 H138" [attr.stroke]="palette().accent" stroke-opacity="0.3" stroke-width="1.1" />
        <path d="M162 300 H196" [attr.stroke]="palette().accent" stroke-opacity="0.3" stroke-width="1.1" />
        <path d="M150 158 V236" [attr.stroke]="palette().accent" stroke-opacity="0.28" stroke-width="1.1" />
      </g>
    }

    @case ('shirt') {
      <g>
        <path
          d="M110 96 L84 116 L68 246 L90 254 L112 148 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M190 96 L216 116 L232 246 L210 254 L188 148 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M110 86 L150 98 L190 86 L202 98 L202 352 L98 352 L98 98 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path
          d="M150 98 L128 84 L136 64 L150 82 L164 64 L172 84 Z"
          [attr.fill]="palette().fabricB"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1"
        />
        <path d="M150 100 V348" [attr.stroke]="palette().accent" stroke-opacity="0.32" stroke-width="1.2" />
        <circle cx="150" cy="150" r="2.6" [attr.fill]="palette().accent" />
        <circle cx="150" cy="196" r="2.6" [attr.fill]="palette().accent" />
        <circle cx="150" cy="242" r="2.6" [attr.fill]="palette().accent" />
        <circle cx="150" cy="288" r="2.6" [attr.fill]="palette().accent" />
        <path
          d="M108 190 H138 V226 H108 Z"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.28"
          stroke-width="1.1"
        />
        <path d="M92 246 H104" [attr.stroke]="palette().accent" stroke-opacity="0.2" stroke-width="1" />
        <path d="M196 246 H208" [attr.stroke]="palette().accent" stroke-opacity="0.2" stroke-width="1" />
      </g>
    }

    @case ('knit') {
      <g>
        <path
          d="M106 94 L80 114 L66 250 L88 258 L110 148 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M194 94 L220 114 L234 250 L212 258 L190 148 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M106 88 L150 102 L194 88 L208 104 L208 344 L92 344 L92 104 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path
          d="M128 96 Q150 116 172 96"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.35"
          stroke-width="1.4"
        />
        <path d="M92 328 H208" [attr.stroke]="palette().accent" stroke-opacity="0.26" stroke-width="1" />
        <path d="M92 336 H208" [attr.stroke]="palette().accent" stroke-opacity="0.2" stroke-width="1" />
        <path d="M68 236 L88 243" [attr.stroke]="palette().accent" stroke-opacity="0.24" stroke-width="1" />
        <path d="M232 236 L212 243" [attr.stroke]="palette().accent" stroke-opacity="0.24" stroke-width="1" />
        <path d="M106 118 V328" stroke="#ffffff" stroke-opacity="0.12" stroke-width="10" />
      </g>
    }

    @case ('tee') {
      <g>
        <path
          d="M104 94 L70 124 L82 170 L108 152 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M196 94 L230 124 L218 170 L192 152 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.18)"
          stroke-width="1.2"
        />
        <path
          d="M104 88 L150 102 L196 88 L206 98 L206 338 L94 338 L94 98 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path
          d="M128 94 Q150 114 172 94"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.4"
          stroke-width="1.4"
        />
        <path d="M94 330 H206" [attr.stroke]="palette().accent" stroke-opacity="0.2" stroke-width="1" />
        <path d="M110 112 V330" stroke="#ffffff" stroke-opacity="0.16" stroke-width="12" />
      </g>
    }

    @case ('jeans') {
      <g>
        <rect
          x="102"
          y="72"
          width="96"
          height="20"
          [attr.fill]="palette().fabricB"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.2"
        />
        <path
          d="M104 92 L196 92 L196 200 L214 392 L166 392 L152 222 L148 222 L134 392 L86 392 L104 200 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path d="M150 92 V212" [attr.stroke]="palette().accent" stroke-opacity="0.5" stroke-width="1.1" />
        <circle cx="150" cy="82" r="3.4" [attr.fill]="palette().accent" />
        <path
          d="M110 104 Q106 132 112 154"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.45"
          stroke-width="1.1"
        />
        <path
          d="M190 104 Q194 132 188 154"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.45"
          stroke-width="1.1"
        />
        <path d="M92 376 H132" [attr.stroke]="palette().accent" stroke-opacity="0.45" stroke-width="1" />
        <path d="M168 376 H208" [attr.stroke]="palette().accent" stroke-opacity="0.45" stroke-width="1" />
        <path d="M108 96 V196" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" />
      </g>
    }

    @case ('trousers') {
      <g>
        <rect
          x="102"
          y="72"
          width="96"
          height="20"
          [attr.fill]="palette().fabricB"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.2"
        />
        <path
          d="M104 92 L196 92 L214 394 L158 394 L150 218 L142 394 L86 394 Z"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.2)"
          stroke-width="1.3"
        />
        <path d="M124 100 L118 214" [attr.stroke]="palette().accent" stroke-opacity="0.45" stroke-width="1.1" />
        <path d="M176 100 L182 214" [attr.stroke]="palette().accent" stroke-opacity="0.45" stroke-width="1.1" />
        <path d="M150 100 V212" [attr.stroke]="palette().accent" stroke-opacity="0.3" stroke-width="1" />
        <path d="M108 96 V206" stroke="#ffffff" stroke-opacity="0.12" stroke-width="8" />
      </g>
    }

    @case ('bag') {
      <g>
        <path
          d="M108 170 C108 96 192 96 192 170"
          fill="none"
          [attr.stroke]="palette().accent"
          stroke-width="7"
          stroke-linecap="round"
        />
        <path
          d="M108 170 C108 96 192 96 192 170"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.16"
          stroke-width="2"
          stroke-linecap="round"
        />
        <rect
          x="80"
          y="158"
          width="140"
          height="200"
          rx="4"
          [attr.fill]="'url(#' + fabricId + ')'"
          stroke="rgba(17,17,16,0.22)"
          stroke-width="1.4"
        />
        <rect x="80" y="158" width="140" height="18" [attr.fill]="palette().fabricB" fill-opacity="0.7" />
        <rect
          x="118"
          y="222"
          width="64"
          height="54"
          fill="#f6f4ef"
          fill-opacity="0.94"
          stroke="rgba(17,17,16,0.14)"
          stroke-width="1"
        />
        <text x="150" y="244" text-anchor="middle" class="garment__label">{{ siteLabel() }}</text>
        <line x1="132" y1="252" x2="168" y2="252" stroke="#111110" stroke-opacity="0.32" stroke-width="0.8" />
        <text x="150" y="266" text-anchor="middle" class="garment__meta">PARIS</text>
        <path
          d="M88 348 H212"
          stroke-dasharray="4 4"
          [attr.stroke]="palette().accent"
          stroke-opacity="0.4"
          stroke-width="1"
        />
      </g>
    }
  }
</svg>
